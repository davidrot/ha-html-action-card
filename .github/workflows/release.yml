name: Release

# Publish a GitHub release (tag vX.Y.Z, matching package.json). This workflow builds the
# card and attaches dist/html-action-card.js, which is the file HACS installs.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Attach card to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/html-action-card.js --clobber
